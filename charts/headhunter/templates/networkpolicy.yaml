{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "headhunter.core.fullname" . }}
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "headhunter.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  policyTypes: [Egress]
  egress:
    # DNS
    - to: []
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # outbound HTTPS (scraper fetches, Bifrost, LLM)
    - to: []
      ports:
        - { protocol: TCP, port: 443 }
    # Postgres
    - to: []
      ports:
        - { protocol: TCP, port: 5432 }
{{- end }}
