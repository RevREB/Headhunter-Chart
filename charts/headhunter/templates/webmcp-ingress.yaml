{{- if and .Values.webmcp.enabled .Values.webmcp.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "headhunter.webmcp.fullname" . }}
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
    app.kubernetes.io/component: webmcp
  {{- with .Values.webmcp.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.webmcp.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.webmcp.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "headhunter.webmcp.fullname" . }}
                port:
                  name: http
{{- end }}
