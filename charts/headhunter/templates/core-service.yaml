apiVersion: v1
kind: Service
metadata:
  name: {{ include "headhunter.core.fullname" . }}
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  type: ClusterIP
  selector:
    {{- include "headhunter.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: core
  ports:
    - name: http
      port: {{ .Values.core.port }}
      targetPort: http
