{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "headhunter.fullname" . }}-operator
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
rules:
  # operator-lite: create one Job per ATS and collect its result
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "headhunter.fullname" . }}-operator
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "headhunter.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "headhunter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
